<!DOCTYPE html>
<html>

<head>
    <title>Sign Up - Premium Lens Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-controls">
        <button id="themeBtn" class="btn" aria-label="Toggle Theme"><i data-lucide="moon"></i></button>
        <button id="rtlBtn" class="btn" aria-label="Toggle RTL">RTL</button>
    </div>

    <main class="auth-section">
        <div class="auth-card signup-card">

            <div class="auth-brand">
                <img src="./assets/logo photo.jpg" alt="Premium Lens Logo" class="auth-brand-logo">
                <div class="auth-brand-name">Premium Lens</div>
                <div class="auth-brand-tagline">Capture Moments. Create Memories.</div>
            </div>

            <div class="auth-header">
                <h1>Create Your Account</h1>
                <p>Join Premium Lens and start creating unforgettable memories.</p>
            </div>

            <div class="social-buttons">
                <button class="social-btn" type="button">
                    <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                    </svg>
                    <span>Continue with Google</span>
                </button>

                <button class="social-btn" type="button">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.35c.67-.82 1.12-1.96.99-3.1-.96.04-2.13.64-2.82 1.44-.61.71-1.14 1.87-1 3 1.07.08 2.16-.52 2.83-1.34z" />
                    </svg>
                    <span>Continue with Apple</span>
                </button>
            </div>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <form id="signupForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <div class="input-wrapper">
                        <i data-lucide="user" class="input-icon"></i>
                        <input type="text" id="signupName" class="form-input-auth" placeholder="John Doe" required>
                    </div>
                    <div id="signupNameError" class="field-error-msg"></div>
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail" class="input-icon"></i>
                        <input type="email" id="signupEmail" class="form-input-auth" placeholder="name@example.com"
                            required>
                    </div>
                    <div id="signupEmailError" class="field-error-msg"></div>
                </div>

                <div class="form-group">
                    <label for="signupPhone">Phone Number</label>
                    <div class="input-wrapper">
                        <i data-lucide="phone" class="input-icon"></i>
                        <input type="tel" id="signupPhone" class="form-input-auth" placeholder="+91 98765 43210"
                            required>
                    </div>
                    <div id="signupPhoneError" class="field-error-msg"></div>
                </div>

                <div class="form-row-2col">
                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <div class="input-wrapper">
                            <i data-lucide="lock" class="input-icon"></i>
                            <input type="password" id="signupPassword" class="form-input-auth has-toggle"
                                placeholder="••••••••" required>
                            <button type="button" class="password-toggle" data-target="signupPassword"
                                aria-label="Toggle Password Visibility">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>
                        <div id="signupPasswordError" class="field-error-msg"></div>
                    </div>

                    <div class="form-group">
                        <label for="signupConfirmPassword">Confirm Password</label>
                        <div class="input-wrapper">
                            <i data-lucide="lock" class="input-icon"></i>
                            <input type="password" id="signupConfirmPassword" class="form-input-auth has-toggle"
                                placeholder="••••••••" required>
                            <button type="button" class="password-toggle" data-target="signupConfirmPassword"
                                aria-label="Toggle Confirm Password Visibility">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>
                        <div id="signupConfirmError" class="field-error-msg"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="signupTerms" required>
                        <span>I agree to the Terms & Privacy Policy</span>
                    </label>
                    <div id="signupTermsError" class="field-error-msg"></div>
                </div>

                <button type="submit" class="btn btn-auth">Create Account</button>
            </form>

            <div class="auth-footer">
                <span>Already have an account?</span>
                <a href="login.html">Login</a>
            </div>

        </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="index.js"></script>
    <script src="auth.js"></script>

</body>

</html>
